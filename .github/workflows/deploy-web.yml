name: Deploy PhotoMagic Web (Firebase Hosting)

# Publishes webapp/ to Firebase Hosting in the PhotoMagic project
# (photomagic-2a69e) -> https://photomagic-2a69e.web.app
#
# Auth: the FIREBASE_SERVICE_ACCOUNT repository secret must contain a
# service-account JSON key (Firebase Hosting Admin) created in the
# photomagic-2a69e project. The key is never committed.
#
# Dispatch-only while the secret is not yet configured on this repo —
# a push would otherwise burn/produce a failing run by design.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy webapp to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify service account secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error title=Missing secret::Add a repository secret named FIREBASE_SERVICE_ACCOUNT" \
              "containing a service-account JSON key (Hosting Admin) from the photomagic-2a69e project."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "Service account key written."

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@13.29.1 deploy \
            --only hosting \
            --project photomagic-2a69e \
            --non-interactive
